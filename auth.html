<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - SmartUp</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; overflow: hidden; }
        .auth-page::before { content: ''; position: absolute; top: -50%; right: -20%; width: 800px; height: 800px; background: radial-gradient(circle, rgba(102,126,234,0.12) 0%, transparent 70%); pointer-events: none; }
        .auth-page::after { content: ''; position: absolute; bottom: -30%; left: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(118,75,162,0.1) 0%, transparent 70%); pointer-events: none; }
        .auth-container { width: 100%; max-width: 440px; position: relative; z-index: 2; }
        .auth-logo { text-align: center; margin-bottom: 32px; }
        .auth-logo .logo-icon { font-size: 3rem; }
        .auth-logo .logo-text { font-size: 2rem; font-weight: 800; display: block; margin-top: 8px; }
        .auth-logo p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 8px; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 36px; }
        .auth-tabs { display: flex; gap: 4px; background: rgba(0,0,0,0.2); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 28px; }
        .auth-tab { flex: 1; padding: 12px; border: none; background: transparent; color: var(--text-secondary); font-family: 'Prompt', sans-serif; font-size: 0.95rem; font-weight: 500; cursor: pointer; border-radius: 8px; transition: var(--transition); }
        .auth-tab.active { background: var(--gradient-1); color: white; }
        .auth-form { display: none; }
        .auth-form.active { display: block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 8px; font-weight: 500; }
        .form-input { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.3); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-family: 'Prompt', sans-serif; font-size: 0.95rem; transition: var(--transition); outline: none; }
        .form-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(102,126,234,0.15); }
        .form-input::placeholder { color: var(--text-muted); }
        .auth-btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-family: 'Prompt', sans-serif; font-size: 1rem; font-weight: 600; cursor: pointer; transition: var(--transition); }
        .auth-btn.primary { background: var(--gradient-1); color: white; box-shadow: 0 8px 30px rgba(102,126,234,0.3); }
        .auth-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(102,126,234,0.4); }
        .auth-message { padding: 12px 16px; border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 0.88rem; display: none; }
        .auth-message.error { display: block; background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: #ff6b6b; }
        .auth-message.success { display: block; background: rgba(46,213,115,0.1); border: 1px solid rgba(46,213,115,0.3); color: #2ed573; }
        .auth-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 0.85rem; }
        .checkin-banner { background: linear-gradient(135deg, rgba(255,165,2,0.15), rgba(255,127,80,0.15)); border: 1px solid rgba(255,165,2,0.3); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; text-align: center; display: none; }
        .checkin-banner.show { display: block; animation: fadeInUp 0.5s ease; }
        .checkin-banner h3 { color: #ffa502; font-size: 1.1rem; margin-bottom: 8px; }
        .checkin-banner p { color: var(--text-secondary); font-size: 0.9rem; }
        .streak-fire { font-size: 2rem; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-logo">
                <span class="logo-icon">&#9733;</span>
                <span class="logo-text">Smart<span class="highlight">Up</span></span>
                <p>ปั้นคนเก่งจากศูนย์ เรียนรู้อย่างเข้าใจ</p>
            </div>

            <div class="checkin-banner" id="checkinBanner">
                <div class="streak-fire">&#128293;</div>
                <h3 id="checkinTitle"></h3>
                <p id="checkinText"></p>
            </div>

            <div class="auth-card">
                <div class="auth-tabs">
                    <button class="auth-tab active" onclick="switchTab('login')">เข้าสู่ระบบ</button>
                    <button class="auth-tab" onclick="switchTab('register')">สมัครสมาชิก</button>
                </div>

                <div id="authMessage" class="auth-message"></div>

                <!-- Login Form -->
                <form class="auth-form active" id="loginForm" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>&#128100; ชื่อผู้ใช้</label>
                        <input type="text" class="form-input" id="loginUsername" placeholder="กรอกชื่อผู้ใช้ของคุณ" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>&#128274; รหัสผ่าน</label>
                        <input type="password" class="form-input" id="loginPassword" placeholder="กรอกรหัสผ่าน" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="auth-btn primary">เข้าสู่ระบบ &#10140;</button>
                </form>

                <!-- Register Form -->
                <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
                    <div class="form-group">
                        <label>&#128100; ชื่อผู้ใช้ (สำหรับ Login)</label>
                        <input type="text" class="form-input" id="regUsername" placeholder="เช่น student01" required minlength="3" autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label>&#128221; ชื่อที่แสดง (ชื่อเล่น)</label>
                        <input type="text" class="form-input" id="regDisplayName" placeholder="เช่น น้องเก่ง" required>
                    </div>
                    <div class="form-group">
                        <label>&#128274; รหัสผ่าน</label>
                        <input type="password" class="form-input" id="regPassword" placeholder="อย่างน้อย 4 ตัวอักษร" required minlength="4" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label>&#128274; ยืนยันรหัสผ่าน</label>
                        <input type="password" class="form-input" id="regConfirm" placeholder="กรอกรหัสผ่านอีกครั้ง" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="auth-btn primary">สมัครสมาชิก &#10140;</button>
                </form>
            </div>

            <div class="auth-footer">
                <p>SmartUp &copy; 2026 - ระบบการเรียนรู้ฟรี 100%</p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        if (Auth.isLoggedIn()) {
            const user = Auth.getCurrentUser();
            if (user && CheckIn.canCheckIn(user.username)) {
                const result = CheckIn.doCheckIn(user.username);
                if (result && result.success) {
                    const banner = document.getElementById('checkinBanner');
                    const title = document.getElementById('checkinTitle');
                    const text = document.getElementById('checkinText');
                    title.innerHTML = `เช็คอินวันนี้สำเร็จ! +${result.xpEarned} XP`;
                    let msg = `Streak: ${result.streak} วันติดต่อกัน`;
                    if (result.levelUp) msg += ` | Level Up! &#127881; Lv.${result.newLevel.level} "${result.newLevel.title}"`;
                    text.innerHTML = msg;
                    banner.classList.add('show');
                    setTimeout(() => { window.location.href = 'index.html'; }, 2500);
                } else {
                    window.location.href = 'index.html';
                }
            } else {
                window.location.href = 'index.html';
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            document.getElementById('authMessage').className = 'auth-message';

            if (tab === 'login') {
                document.querySelectorAll('.auth-tab')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.auth-tab')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        function showMessage(text, type) {
            const el = document.getElementById('authMessage');
            el.textContent = text;
            el.className = 'auth-message ' + type;
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            const result = Auth.login(username, password);

            if (result.success) {
                showMessage(result.message, 'success');
                const user = Auth.getCurrentUser();
                if (user && CheckIn.canCheckIn(user.username)) {
                    const checkin = CheckIn.doCheckIn(user.username);
                    if (checkin && checkin.success) {
                        showMessage(`${result.message} | เช็คอิน Streak ${checkin.streak} วัน +${checkin.xpEarned} XP`, 'success');
                    }
                }
                Achievements.check(Auth.getSession().username);
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } else {
                showMessage(result.message, 'error');
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const username = document.getElementById('regUsername').value;
            const displayName = document.getElementById('regDisplayName').value;
            const password = document.getElementById('regPassword').value;
            const confirm = document.getElementById('regConfirm').value;

            if (password !== confirm) {
                showMessage('รหัสผ่านไม่ตรงกัน', 'error');
                return;
            }

            const result = Auth.register(username, displayName, password);
            if (result.success) {
                CheckIn.doCheckIn(username.toLowerCase().trim());
                Achievements.check(username.toLowerCase().trim());
                showMessage(result.message, 'success');
                setTimeout(() => { window.location.href = 'index.html'; }, 1200);
            } else {
                showMessage(result.message, 'error');
            }
        }
    </script>
</body>
</html>
